ci:
  autofix_commit_msg: |
    ci: auto fixes from pre-commit hooks
    for more information, see https://pre-commit.ci
  autofix_prs: false
  autoupdate_commit_msg: 'ci: pre-commit autoupdate'
  autoupdate_schedule: monthly

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending
      - id: trailing-whitespace
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.3.1
    hooks:
      - id: pyupgrade
        args: [ "--py37-plus" ]
  - repo: https://github.com/adamchainz/django-upgrade
    rev: '1.13.0'
    hooks:
      - id: django-upgrade
        args: [ --target-version, "2.2" ]
  - repo: https://github.com/PyCQA/flake8
    rev: 6.0.0
    hooks:
      - id: flake8
        exclude: ^.*\/migrations\/.*$|^config
        args:
          - '--max-line-length=120'
          # Flake8 6 mis-tokenises URL/HTTP punctuation inside f-strings on
          # Python 3.12. Keep the exceptions scoped to the affected files.
          - >-
            --per-file-ignores=blog/test_editorial.py:E231,
            events/admin.py:E702,
            events/test_admin_gallery.py:E231,
            events/test_gallery.py:E231,
            mainsite/management/commands/backfill_event_gallery_tags.py:E231


  - repo: https://github.com/asottile/yesqa
    rev: v1.4.0
    hooks:
      - id: yesqa
  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.4
    hooks:
      - id: codespell
        exclude: ^assets/blog/vendor/cropperjs/|^poetry\.lock$

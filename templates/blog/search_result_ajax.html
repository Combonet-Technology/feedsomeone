{% for article in objects %}
<article class="blog_item">
    <div class="blog_details">
        <a class="d-inline-block" href="{{ article.get_absolute_url  }}">
            <h2 class="blog-head" style="color: #2d2d2d;">{{article.public_title}}</h2>
        </a>
        <p>{{article.public_content|safe|truncatewords_html:30}}</p>
        <ul class="blog-info-link">
            <li>
                <a href="{% url 'article:article-by-user' article.public_author.username %}">Written
                    by
                    <i class="fa fa-user"></i> {{article.public_author.get_full_name}}</a>
            </li>
            <li class="tags">
                Tags:
                {% for tag in article.public_tags %}
                <a href="{% url 'article:articles-by-slug' tag.slug %}">
                    {{ tag.name }}
                </a>
                {% if not forloop.last %}, {% endif %}
                {% endfor %}
            </li>
            <!--                                        <li><a href="#"><i class="fa fa-comments"></i> 03 Comments</a></li>-->
        </ul>

    </div>
</article>
{% endfor %}
